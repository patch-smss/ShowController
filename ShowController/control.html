<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>Show Control Deck</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="panel">
    <h2>
      <span>Master Cue List</span>
      <span>
        <button id="btn-save" style="display:none;">Save Show</button>
        <button id="btn-load" style="display:none;">Load Show</button>
        <button id="btn-clear" style="background:#7f1d1d;">Clear</button>
        <input type="file" id="load-file" accept=".json" style="display:none" />
      </span>
    </h2>

    <div class="preview-strip">
      <div class="preview-card"><span>Now Live</span><strong id="now-title">--</strong></div>
      <div class="preview-card"><span>Next Up</span><strong id="next-title" style="color:#a3e635">--</strong></div>
    </div>

    <div id="dropzone">Drag & drop any Image, Audio, Video, or PPTX file</div>

    <div id="slot-toolbar" class="toolbar-row" style="flex-wrap:wrap;">
      <button id="btn-browse-files" style="background:#0284c7; flex:1;">+ Browse Media</button>
      <input type="file" id="file-picker" multiple accept="image/*,audio/*,video/*,.pdf,.ppt,.pptx" style="display:none" />
    </div>

    <div id="slot-cue-panel" class="slot-container"></div>
    <div id="cue-list"></div>
  </div>

  <div class="panel">
    <h2>Stage Controls</h2>
    <div class="controls">
      <button id="btn-next" class="btn-go">NEXT CUE (Space / Right)</button>
      <button id="btn-prev">PREVIOUS CUE (Left)</button>
      <button id="btn-open-proj" class="btn-proj">Focus / Launch Stage</button>

      <div id="slot-stage-panel" class="slot-container"></div>

      <button id="btn-end-show" class="btn-danger" style="margin-top:auto; padding:12px;">
        End Show & Exit
      </button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
