<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Show Phone Remote</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #f1f5f9; margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; margin: 0; text-align: center; }
  button { padding: 15px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; color: #fff; background: #334155; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(0.98); filter: brightness(1.2); }
  .btn-next { background: #16a34a; font-size: 20px; padding: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-black { background: #dc2626; }
  .btn-inter { background: #d97706; }
  .btn-freeze { background: #0284c7; }
  .btn-panic { background: #7f1d1d; border: 2px solid #ef4444; margin-top: 4px; }
  .box { background: #1a1d24; border: 1px solid #2a2f3a; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
  #toast { text-align: center; font-size: 12px; color: #4ade80; min-height: 16px; }
</style>
</head>
<body>
  <h1>Stage Phone Remote</h1>
  <div id="toast">Ready</div>

  <button class="btn-next" onclick="sendCmd({ type: 'NEXT' })">NEXT CUE ➔</button>
  <button onclick="sendCmd({ type: 'PREV' })">⬅ PREVIOUS CUE</button>

  <div class="grid-2">
    <button class="btn-black" onclick="sendCmd({ type: 'BLACKOUT' })">BLACKOUT (B)</button>
    <button class="btn-inter" onclick="sendCmd({ type: 'INTERMISSION' })">INTERMISSION (I)</button>
    <button class="btn-freeze" onclick="sendCmd({ type: 'FREEZE' })">FREEZE (F)</button>
    <button onclick="sendCmd({ type: 'STOP_AUDIO' })">STOP AUDIO</button>
    <button style="background:#475569;" onclick="sendCmd({ type: 'BACK_PROJ_TAB' })">PROJECTOR TAB (W)</button>
    <button style="background:#0369a1;" onclick="sendCmd({ type: 'FOCUS_PROJ' })">FOCUS SCREEN (P)</button>
  </div>

  <div class="box">
    <strong style="font-size:12px; color:#94a3b8; text-transform:uppercase;">Push YouTube / Canva Link</strong>
    <input type="text" id="link-url" placeholder="Paste YouTube or Canva link..." />
    <div class="grid-2">
      <button onclick="pushLink(false)">+ Add to Queue</button>
      <button style="background:#7c3aed;" onclick="pushLink(true)">▶ Open Now</button>
    </div>
  </div>

  <button class="btn-panic" onclick="if(confirm('Trigger Emergency Blackout?')) sendCmd({ type: 'PANIC' })">PANIC / EMERGENCY BLACKOUT</button>

<script>
  const toast = document.getElementById('toast');
  async function sendCmd(payload) {
    try {
      await fetch('/api/phone-cmd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      toast.textContent = 'Sent: ' + payload.type;
      setTimeout(() => { toast.textContent = ''; }, 1500);
    } catch {
      toast.textContent = 'Connection lost';
    }
  }

  function pushLink(playNow) {
    const input = document.getElementById('link-url');
    const url = input.value.trim();
    if (!url) return;
    sendCmd({ type: 'ADD_LINK', url, playNow });
    input.value = '';
  }
</script>
</body>
</html>
