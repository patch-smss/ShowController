<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Show Phone Remote</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; flex-direction: column; height: auto; min-height: 100vh; padding: 14px; gap: 10px; }
  button { padding: 14px; font-size: 15px; touch-action: manipulation; }
  .btn-go { font-size: 19px; padding: 20px; }
  #toast { text-align: center; font-size: 12px; color: #4ade80; min-height: 16px; }
  #offline-view { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: 1; gap: 14px; padding: 32px 16px; }
</style>
</head>
<body>
  <div id="offline-view">
    <div style="font-size:28px; font-weight:700; color:#f87171;">[ OFFLINE ]</div>
    <h2 style="justify-content:center; color:#f87171; font-size:16px; margin:0;">No Connection / Show Not Active</h2>
    <p style="color:#94a3b8; font-size:13px; margin:0; max-width:280px;">The show has either ended or hasn't started on the host PC yet.</p>
    <button style="background:#0284c7; padding:14px 28px;" onclick="location.reload()">Refresh Connection</button>
  </div>

  <div id="active-view" style="display:flex; flex-direction:column; gap:10px;">
    <h2 style="justify-content:center; margin:0; color:#38bdf8;">Stage Phone Remote</h2>
    <div id="toast">Ready</div>
    <input type="password" id="pin-input" placeholder="Remote PIN (leave blank if none)" />
    <div id="slot-stage-panel" class="controls"></div>
  </div>

<script type="module">
  const offlineView = document.getElementById('offline-view');
  const activeView = document.getElementById('active-view');
  const toastEl = document.getElementById('toast');
  const pinEl = document.getElementById('pin-input');
  pinEl.value = localStorage.getItem('show_remote_pin') || '';
  pinEl.onchange = () => localStorage.setItem('show_remote_pin', pinEl.value.trim());

  const setOffline = (isOff) => {
    offlineView.style.display = isOff ? 'flex' : 'none';
    activeView.style.display = isOff ? 'none' : 'flex';
  };

  const toast = (msg, err = false) => {
    toastEl.style.color = err ? '#f87171' : '#4ade80';
    toastEl.textContent = msg;
    setTimeout(() => { toastEl.textContent = ''; }, 2000);
  };

  async function sendCmd(payload) {
    try {
      const res = await fetch('/api/phone-cmd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, pin: pinEl.value.trim() })
      });
      if (res.status === 401) return toast('Invalid Remote PIN', true);
      toast('Sent: ' + payload.type);
    } catch { setOffline(true); }
  }

  // Proxy stage plugin events to the host PC over HTTP
  const listeners = new Map();
  const ctx = {
    store: { cues: [], getActiveIndex: () => -1 },
    channel: { postMessage: () => {} },
    state: { blackout: true, intermission: false, endAction: 'intermission', audioPrefs: { fadeIn: true, fadeOut: true } },
    on(ev, fn) { if (!listeners.has(ev)) listeners.set(ev, new Set()); listeners.get(ev).add(fn); },
    emit(ev) {
      if (ev === 'TOGGLE_BLACKOUT') sendCmd({ type: 'BLACKOUT' });
      if (ev === 'TOGGLE_INTERMISSION') sendCmd({ type: 'INTERMISSION' });
      if (ev === 'TOGGLE_FREEZE') sendCmd({ type: 'FREEZE' });
      if (ev === 'STOP_AUDIO') sendCmd({ type: 'STOP_AUDIO' });
      if (ev === 'TRIGGER_PANIC') sendCmd({ type: 'PANIC' });
    },
    actions: {
      nextCue: () => sendCmd({ type: 'NEXT' }),
      prevCue: () => sendCmd({ type: 'PREV' }),
      openProjector: () => sendCmd({ type: 'FOCUS_PROJ' }),
      closeWebWindow: () => sendCmd({ type: 'BACK_PROJ_TAB' }),
      pptPost: async (url, body) => {
        if (body?.action === 'goto' && body.slide >= 2) await sendCmd({ type: 'GOTO_PAGE', page: body.slide - 1 });
        if (body?.action === 'blackout') await sendCmd({ type: 'BLACKOUT' });
        if (url === '/api/ppt/intermission') await sendCmd({ type: 'INTERMISSION' });
        return { ok: true };
      },
      sendCmd, toast, getPin: () => pinEl.value.trim()
    }
  };

  try {
    const manifest = await (await fetch('/api/plugins?client=mobile')).json();
    const container = document.getElementById('slot-stage-panel');
    for (const url of (manifest['slot-stage-panel'] || [])) {
      try { const mod = await import(url); if (mod.init) await mod.init(container, ctx); } catch {}
    }
  } catch { setOffline(true); }

  setInterval(async () => {
    try {
      const res = await fetch('/api/info', { cache: 'no-store' });
      if (!res.ok) throw new Error();
    } catch { setOffline(true); }
  }, 2500);
</script>
</body>
</html>
