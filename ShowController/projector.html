<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projector Output</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  body.fullscreen { cursor: none; }
  #stage, #freeze-layer, #intermission-layer { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
  #stage img, #stage video, #freeze-layer img, #freeze-layer canvas, #intermission-layer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #freeze-layer { z-index: 50; display: none; }
  #intermission-layer { z-index: 75; display: none; color: #64748b; font-size: 32px; letter-spacing: 3px; font-weight: 600; }
  #blackout-layer { position: fixed; inset: 0; background: #000; z-index: 100; opacity: 1; transition: opacity 0.25s ease; pointer-events: none; }
  #blackout-layer.off { opacity: 0; }
  #fs-btn { position: fixed; top: 20px; right: 20px; z-index: 200; background: rgba(30, 41, 59, 0.9); color: #fff; border: 1px solid #475569; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  body.fullscreen #fs-btn { display: none; }
</style>
</head>
<body>
  <button id="fs-btn" onclick="enterFullscreen()">⛶ Go Fullscreen (F11)</button>
  <div id="stage"></div>
  <div id="freeze-layer"></div>
  <div id="intermission-layer">
    <img id="intermission-img" src="/Media/intermission.png" alt="Intermission" />
  </div>
  <div id="blackout-layer"></div>

<script>
  const channel = new BroadcastChannel('show_controller_bus');
  const stage = document.getElementById('stage');
  const freezeLayer = document.getElementById('freeze-layer');
  const intermissionLayer = document.getElementById('intermission-layer');
  const intermissionImg = document.getElementById('intermission-img');
  const blackout = document.getElementById('blackout-layer');

  let activeVisual = null;
  let activeAudio = null;
  const openTabs = {}; // Stores references to YouTube/Canva tabs opened in this window

  intermissionImg.onerror = () => {
    if (intermissionImg.src.endsWith('.png')) {
      intermissionImg.src = '/Media/intermission.jpg';
    } else {
      intermissionImg.style.display = 'none';
      intermissionLayer.textContent = 'INTERMISSION';
    }
  };

  function enterFullscreen() {
    document.documentElement.requestFullscreen().catch(() => {});
  }

  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
  });

  function fadeAudio(audioEl, targetVol, durationMs, onDone) {
    if (audioEl._fadeTimer) clearInterval(audioEl._fadeTimer);
    const steps = 25;
    const stepTime = durationMs / steps;
    const volStep = (targetVol - audioEl.volume) / steps;

    audioEl._fadeTimer = setInterval(() => {
      let nextVol = audioEl.volume + volStep;
      if ((volStep > 0 && nextVol >= targetVol) || (volStep < 0 && nextVol <= targetVol)) {
        audioEl.volume = targetVol;
        clearInterval(audioEl._fadeTimer);
        if (onDone) onDone();
      } else {
        audioEl.volume = Math.max(0, Math.min(1, nextVol));
      }
    }, stepTime);
  }

  function clearVisual() {
    if (activeVisual && activeVisual.tagName === 'VIDEO') {
      activeVisual.pause();
    }
    stage.innerHTML = '';
    activeVisual = null;
  }

  function stopCurrentAudio(useFadeOut) {
    if (!activeAudio) return;
    const oldAudio = activeAudio;
    activeAudio = null;

    if (useFadeOut && !oldAudio.paused) {
      fadeAudio(oldAudio, 0, 1500, () => {
        oldAudio.pause();
        oldAudio.remove();
      });
    } else {
      if (oldAudio._fadeTimer) clearInterval(oldAudio._fadeTimer);
      oldAudio.pause();
      oldAudio.remove();
    }
  }

  function closeAllTabs() {
    Object.values(openTabs).forEach(tab => {
      try { if (tab && !tab.closed) tab.close(); } catch {}
    });
    for (const k in openTabs) delete openTabs[k];
    window.focus();
  }

  channel.onmessage = (e) => {
    const msg = e.data;
    if (!msg) return;

    if (msg.type === 'SHUTDOWN') {
      closeAllTabs();
      window.close();
      return;
    }

    if (msg.type === 'FOCUS_PROJECTOR_TAB') {
      window.focus();
      return;
    }

    if (msg.type === 'CLOSE_TABS') {
      closeAllTabs();
      return;
    }

    if (msg.type === 'OPEN_TAB') {
      let tab = openTabs[msg.cueId];
      if (!tab || tab.closed) {
        // Opens as a new tab inside this Monitor 2 browser window
        tab = window.open(msg.url, 'tab_' + msg.cueId);
        openTabs[msg.cueId] = tab;
      }
      if (msg.switchToTab) {
        if (tab) tab.focus();
      } else {
        // Keep Projector tab focused while YouTube/Canva loads in the background tab!
        setTimeout(() => window.focus(), 150);
      }
      return;
    }

    if (msg.type === 'SET_INTERMISSION_IMG') {
      intermissionLayer.textContent = '';
      intermissionImg.style.display = 'block';
      intermissionImg.src = msg.url;
      intermissionLayer.appendChild(intermissionImg);
      return;
    }

    if (msg.type === 'BLACKOUT') {
      blackout.classList.toggle('off', !msg.active);
      if (msg.active) {
        intermissionLayer.style.display = 'none';
        window.focus(); // Switch back to Tab 1 (Projector Output)
      }
      return;
    }

    if (msg.type === 'INTERMISSION') {
      intermissionLayer.style.display = msg.active ? 'flex' : 'none';
      if (msg.active) {
        blackout.classList.add('off');
        window.focus(); // Switch back to Tab 1 (Projector Output)
      }
      return;
    }

    if (msg.type === 'FREEZE') {
      if (msg.active) {
        freezeLayer.innerHTML = '';
        if (activeVisual && activeVisual.tagName === 'VIDEO') {
          const canvas = document.createElement('canvas');
          canvas.width = activeVisual.videoWidth || 1280;
          canvas.height = activeVisual.videoHeight || 720;
          canvas.getContext('2d').drawImage(activeVisual, 0, 0, canvas.width, canvas.height);
          freezeLayer.appendChild(canvas);
        } else {
          freezeLayer.innerHTML = stage.innerHTML;
        }
        freezeLayer.style.display = 'flex';
      } else {
        freezeLayer.style.display = 'none';
        freezeLayer.innerHTML = '';
      }
      return;
    }

    if (msg.type === 'STOP_AUDIO') {
      stopCurrentAudio(msg.fadeOut);
      return;
    }

    if (msg.type === 'PANIC') {
      stopCurrentAudio(false);
      clearVisual();
      freezeLayer.style.display = 'none';
      intermissionLayer.style.display = 'none';
      blackout.classList.remove('off');
      window.focus();
      return;
    }

    if (msg.type === 'CUE') {
      const cue = msg.cue;

      if (cue.kind === 'ppt') {
        clearVisual();
        intermissionLayer.style.display = 'none';
        blackout.classList.remove('off');
        return;
      }

      if (cue.kind === 'audio') {
        stopCurrentAudio(msg.fadeOut);
        const mediaUrl = cue.src.startsWith('blob:') ? cue.src : '/Media/' + encodeURIComponent(cue.src);
        const audio = document.createElement('audio');
        audio.src = mediaUrl;
        audio.volume = msg.fadeIn ? 0 : 1;
        audio.onended = () => {
          if (activeAudio === audio) activeAudio = null;
          audio.remove();
          channel.postMessage({ type: 'MEDIA_ENDED' });
        };
        document.body.appendChild(audio);
        audio.play().catch(() => console.warn('Click Go Fullscreen on projector to unlock audio.'));
        activeAudio = audio;
        if (msg.fadeIn) fadeAudio(audio, 1, 1500);
        return;
      }

      // Visual cues (image, video) -> Switch back to Tab 1 (Projector Output)
      window.focus();
      intermissionLayer.style.display = 'none';
      clearVisual();

      if (cue.kind === 'image') {
        const mediaUrl = cue.src.startsWith('blob:') ? cue.src : '/Media/' + encodeURIComponent(cue.src);
        const img = document.createElement('img');
        img.src = mediaUrl;
        stage.appendChild(img);
        activeVisual = img;
      } else if (cue.kind === 'video') {
        const mediaUrl = cue.src.startsWith('blob:') ? cue.src : '/Media/' + encodeURIComponent(cue.src);
        const video = document.createElement('video');
        video.src = mediaUrl;
        video.onended = () => channel.postMessage({ type: 'MEDIA_ENDED' });
        stage.appendChild(video);
        video.play().catch(() => console.warn('Click Go Fullscreen on projector to unlock video autoplay.'));
        activeVisual = video;
      }
    }
  };
</script>
</body>
</html>
